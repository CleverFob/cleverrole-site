<style>
@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(/inter.woff2) format('woff2-variations')}
:root{--bg:#000;--fg:#f4f4f2;--muted:#8a8c8c;--line:#2a2c2d;--face:'Inter Variable',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff;--fg:#0a0a0a;--muted:#5d5f60;--line:#dcdddc;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--face);font-weight:400;line-height:1.7;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
header img{height:22px;width:auto;filter:var(--mark)}
:root{--mark:invert(0)} :root[data-theme="light"]{--mark:invert(1)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font-size:clamp(32px,6vw,48px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:0 0 12px}
.dates{color:var(--muted);font-size:13px;margin:0 0 28px}
.intro{font-size:17px;margin:0 0 40px}
section{border-top:1px solid var(--line);padding-block:24px}
h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
section p{margin:0;font-size:15px;color:var(--fg);opacity:.86}
a{color:var(--fg)}
footer{border-top:1px solid var(--line);margin-top:24px;padding-top:20px;display:flex;gap:22px;flex-wrap:wrap;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
footer a{color:var(--muted);text-decoration:none} footer a:hover{color:var(--fg)}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.theme span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
