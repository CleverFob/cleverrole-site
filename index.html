@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(/inter.woff2) format('woff2-variations');}
/* Layout: one still, dark stage. The spinning symbol and the official wordmark sit dead centre; everything else whispers at the edges. */
:root{
  --bg:#000; --fg:#f4f4f2; --muted:#8a8c8c; --line:#2a2c2d; --panel:#0d0e0f;
  --mark-filter:invert(0); --blend:screen;
  --face:'Inter Variable',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff; --fg:#0a0a0a; --muted:#6b6d6e; --line:#dcdddc; --panel:#f6f6f5;
  --mark-filter:invert(1); --blend:multiply;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--face);font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .6s ease,color .6s ease;overflow:hidden}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.stage{position:relative}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 45%,var(--bg) 100%)}
.stage{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-block:18px 20px;box-sizing:border-box}
.top{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.bgname{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s ease;pointer-events:none}
.bgname.show{opacity:1}
#bgCycle svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.5;transition:transform .6s ease}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.theme span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.theme:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.centre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vh,14px);min-height:0;padding-bottom:7vh}
.centre{--w:min(62vw,40vh,380px)}  /* wordmark width; the symbol is sized from it, as in the official stacked logo */
.symbol{width:calc(var(--w) * 1.008);aspect-ratio:1;max-width:100%;filter:contrast(1.15) var(--mark-filter);

#symbol{cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}

.word{width:var(--w);position:relative;height:auto;filter:var(--mark-filter);opacity:0;animation:rise 1.4s .9s ease forwards}
.soon{font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;padding-left:.32em;opacity:0;animation:rise 1.4s 1.6s ease forwards}
.tag{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--fg);margin:22px 0 0;text-align:center;opacity:0;animation:rise 1.4s 1.2s ease forwards}
.line{text-wrap:balance;max-width:92vw;font-size:clamp(14px,2vw,16px);font-weight:400;color:var(--muted);margin:6px 0 0;text-align:center;letter-spacing:-.01em;opacity:0;animation:rise 1.4s 1.4s ease forwards}

.top{position:relative}

#colorBtn i{width:14px;height:14px;border-radius:50%;background:var(--sw,var(--fg));box-shadow:0 0 0 1.5px var(--fg) inset,0 0 10px -2px var(--sw,transparent)}

.pop{position:absolute;z-index:6;top:calc(100% + 10px);right:0;width:min(250px,calc(100vw - 32px));box-sizing:border-box;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;justify-items:center;padding:2px 2px 6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45);transition:transform .2s}

@media (prefers-reduced-motion:reduce){.symbol,.word,.tag,.soon,.line{animation:none;opacity:1}}
</style>

CleverRoleChat.mailtoHook=function(addr){return function(d){

    body:JSON.stringify({access_key:key,subject:'cleverrole.com: '+d.topic+' from '+d.name,from_name:'cleverrole.com',name:d.name,email:d.email,replyto:d.email,topic:d.topic,message:d.message})})

/* Living background, six styles: precision gears, a workflow network, orbits, contours, ripples and a lattice.
   Every style runs off the same phase as the spinning symbol (window.crSpin, eased in by window.crWake),
   so it starts still with the symbol, and flicking the symbol speeds it up or turns it the other way. */
(function(){
  var c=document.getElementById('field'), x=c.getContext('2d'); if(!x) return;
  var root=document.documentElement, W=0,H=0,D=1, mx=0,my=0, tx=0,ty=0, run=true, prev=performance.now(), T=0, PH=0, OT=0, AX=0, AY=0, skip=0;

  var MODE=(function(){try{return localStorage.getItem('cr-bg')||'gears'}catch(e){return 'gears'}})(); if(MODES.indexOf(MODE)<0)MODE='gears';
  window.crSetBackground=function(m){if(MODES.indexOf(m)<0)return;MODE=m;try{localStorage.setItem('cr-bg',m)}catch(e){};build();if(still)render(0,1);};
  // How strongly each style shows. Kept low on purpose: the background should be felt more than seen.
  var FADE={gears:0.72,network:0.56,orbits:0.56,contours:0.64,ripples:0.7,lattice:0.65}, LIGHT=0.85, K=1;  // a modest step up from v18 (about a quarter stronger)

  // Line colour: the page sets --tint ("r, g, b") from the colour button; empty means the page's own ink. --tintk scales line strength.
  var C=rgb(ink());
  function tint(){var cs=getComputedStyle(root),t=cs.getPropertyValue('--tint').trim();C=t?t.split(',').map(Number):rgb(ink());K=parseFloat(cs.getPropertyValue('--tintk'))||1;}
  new MutationObserver(function(){tint();if(still)render(0,1);}).observe(root,{attributes:true,attributeFilter:['data-theme','style']});
  function col(a){return 'rgba('+C[0]+','+C[1]+','+C[2]+','+a+')';}

     A = 40 teeth (r 20) on even cells, B = 24 teeth (r 12) on odd cells. The cell pitch is 32 = rA + rB, so every gear
     is tangent to all four of its neighbours, and same-size gears sit on the diagonals, 45.25 apart, clear of each other.
     A's teeth sit on the lattice axes and B is offset half a tooth, so each tooth lands in its neighbour's gap.
     A turns with the symbol (clockwise), B the other way at 40/24 the speed, so the teeth stay meshed at every angle.
     The lattice is tilted a little, centred on the symbol, and the index range comes from the four screen corners. */

      for(var j=0;j<5;j++){var X=pts[j][0]*Math.cos(pts[j][1]),Y=pts[j][0]*Math.sin(pts[j][1]);(k||j)?o.lineTo(X,Y):o.moveTo(X,Y);}}

    var sp=n>=36?6:4;for(var s=0;s<sp;s++){var aa=s*TAU/sp;d.moveTo(Math.cos(aa)*r*0.18,Math.sin(aa)*r*0.18);d.lineTo(Math.cos(aa)*r*0.6,Math.sin(aa)*r*0.6);}
    return {n:n,r:r,o:o,d:d};}
  function buildGears(){if(!GL)GL={A:gearShape(GA),B:gearShape(GB)};}
  // pixels per tooth unit, from the short side of the screen
  function gearScale(){return Math.max(3.5,Math.min(6,Math.min(W,H)/D/230))*D;}
  function drawGears(){
    var k=gearScale(), ox=AX-mx*24*D, oy=AY-my*18*D, th=PH*0.12, cs=Math.cos(GTILT), sn=Math.sin(GTILT), step=GP*k;
    // lattice index range: the four canvas corners taken back into lattice coordinates
    var i0=1e9,i1=-1e9,j0=1e9,j1=-1e9, cx=[0,W,0,W], cy=[0,0,H,H];
    for(var q=0;q<4;q++){var dx=cx[q]-ox,dy=cy[q]-oy,u=(dx*cs+dy*sn)/step,v=(-dx*sn+dy*cs)/step;
      i0=Math.min(i0,u);i1=Math.max(i1,u);j0=Math.min(j0,v);j1=Math.max(j1,v);}
    i0=Math.floor(i0)-1;i1=Math.ceil(i1)+1;j0=Math.floor(j0)-1;j1=Math.ceil(j1)+1;
    var angA=GTILT+th, angB=GTILT-th*(GA/GB)+Math.PI/GB, lw=Math.max(1,D*0.8)/k, a=0.12;
    for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){
      var even=((i+j)&1)===0, g=even?GL.A:GL.B, X=ox+(i*cs-j*sn)*step, Y=oy+(i*sn+j*cs)*step, R=(g.r+1)*k;
      if(X+R<0||X-R>W||Y+R<0||Y-R>H)continue;

      x.setLineDash([2*D/k,5*D/k]);x.beginPath();x.arc(0,0,g.r,0,TAU);x.strokeStyle=col(a*0.35);x.stroke();x.setLineDash([]);
      x.rotate(even?angA:angB);

      x.strokeStyle=col(a*0.6);x.stroke(g.d);

  /* ---------- network: work moving between connected tasks ---------- */

  function buildNet(){
    nodes=[];edges=[];pulses=[]; rnd=(function(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};})(11);
    var step=Math.max(90,Math.min(W,H)/D/6)*D, cols=Math.ceil(W/step)+1, rows=Math.ceil(H/step)+1;
    for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){if(rnd()<0.28)continue;
      nodes.push({x:(i+0.5*(j%2))*step+(rnd()-.5)*step*0.5,y:j*step+(rnd()-.5)*step*0.5,z:0.5+rnd(),glow:0,sq:rnd()<0.35});}
    for(var a=0;a<nodes.length;a++){var best=[];for(var b=0;b<nodes.length;b++){if(a===b)continue;var d=Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);best.push([d,b]);}
      best.sort(function(p,q){return p[0]-q[0]});for(var k=0;k<2;k++){var bb=best[k][1];if(bb>a)edges.push([a,bb,best[k][0]]);}}
    for(var p=0;p<Math.min(40,edges.length/2);p++)pulses.push({e:Math.floor(rnd()*edges.length),t:rnd(),dir:rnd()<.5?1:-1,s:0.15+rnd()*0.25});
  }
  function drawNet(dt,spin){

    x.lineWidth=Math.max(1,D*0.8);
    for(var i=0;i<edges.length;i++){var e=edges[i],A=nodes[e[0]],B=nodes[e[1]];
      x.beginPath();x.moveTo(A.x+ox*A.z,A.y+oy*A.z);
      var midx=(A.x+B.x)/2; x.lineTo(midx+ox*(A.z+B.z)/2,A.y+oy*A.z); x.lineTo(midx+ox*(A.z+B.z)/2,B.y+oy*B.z); x.lineTo(B.x+ox*B.z,B.y+oy*B.z);
      x.strokeStyle=col(0.07);x.stroke();}
    for(var p=0;p<pulses.length;p++){var q=pulses[p], e=edges[q.e], A=nodes[e[0]],B=nodes[e[1]];
      q.t+=dt*q.s*(1+Math.abs(spin)*1.5)*(300*D/e[2]);
      if(q.t>=1){var end=q.dir>0?e[1]:e[0];nodes[end].glow=1;var nxt=[];for(var k=0;k<edges.length;k++){if(edges[k][0]===end)nxt.push([k,1]);else if(edges[k][1]===end)nxt.push([k,-1]);}

      var pts=[[A.x+ox*A.z,A.y+oy*A.z],[midx+ox*z,A.y+oy*A.z],[midx+ox*z,B.y+oy*B.z],[B.x+ox*B.z,B.y+oy*B.z]];

  /* ---------- orbits (the earlier version) ---------- */

  function buildOrbits(){orbits=[];for(var i=0;i<12;i++)orbits.push({r:0.34+i*0.055,tilt:(i*29)%180*Math.PI/180,squash:0.22+((i*37)%50)/100,speed:(0.04+((i*17)%10)/120)*(i%2?1:-1),phase:i*0.9,beads:2+(i%3)});

    r=Math.max(b.width,b.height*0.8)*0.62*D,g=x.createRadialGradient(cx,cy,0,cx,cy,r);

  function drawContours(){

    am:[57,60,64,67],f:[53,57,60,64],c:[60,64,67,71],g:[55,59,62,65],dm:[62,65,69,72],g7:[55,59,65,69],cm9:[60,64,67,71],em:[52,55,59,62],d:[50,54,57,62]};
  var LP={
    drift:{bpm:60,step:function(i,t){var b=i>>4,ch=[CH.am,CH.f,CH.c,CH.g][b];
      if(i%16===0)pad(t,ch.slice(1).map(function(m){return m+12;}).concat([ch[0]]),5.2,0.035);
      if(i%8===4){var sc=[69,72,74,76,79,81];tone(t,sc[Math.floor(rnd(i+3)*6)],1.8,'sine',0.05,{a:0.02,send:0.7});}}},
    lofi:{bpm:76,step:function(i,t){var b=i>>4,s=i%16,ch=[CH.dm,CH.g7,CH.cm9,CH.am][b],sw=(s%2)?0.035:0;
      if(s===0||s===10)kick(t,0.55);if(s===4||s===12)snare(t,0.22);if(s%2===0)hat(t+sw,s%4===0?0.06:0.035);
      if(s===0||s===6||s===10){ch.forEach(function(m,k){tone(t+k*0.012,m,1.1,'triangle',0.05,{cut:1600,cut2:500,a:0.006});tone(t+k*0.012,m+12,0.7,'sine',0.02,{a:0.006});});}
      if(s===0||s===10)tone(t,ch[0]-24,0.9,'sine',0.2,{a:0.01});}},
    pulse:{bpm:100,step:function(i,t){var b=i>>4,s=i%16,ch=[CH.am,CH.f,CH.c,CH.g][b];
      if(s%4===0)kick(t,0.5);if(s===4||s===12)snare(t,0.16);if(s%2===0)hat(t,0.03);
      if(s%2===0)tone(t,ch[0]-24,0.2,'sawtooth',0.12,{cut:420,cut2:180});
      var a=[0,1,2,3,2,1,2,3][s>>1];if(s%2===1||true)tone(t,ch[a]+12,0.22,'sawtooth',0.04,{cut:1800,cut2:600,det:s%4?5:-5,send:0.35});}},
    bells:{bpm:70,step:function(i,t){var sc=[60,62,64,67,69,72,74,76,79];
      if(i%16===0)tone(t,36+(i>>4===2?-5:i>>4===3?-3:0),5,'sine',0.12,{a:1.2});
      if(i%2===0&&rnd(i*1.7)<0.42)bell(t,sc[Math.floor(rnd(i+9)*sc.length)],0.07);}},
    deep:{bpm:122,step:function(i,t){var b=i>>4,s=i%16,r=[42,42,45,40][b];
      if(s%4===0)kick(t,0.6);if(s%4===2)hat(t,0.05,true);if(s===4||s===12)nz(t,0.12,'bandpass',1500,0.12);
      if(s===3||s===6||s===10||s===14)tone(t,r-12,0.22,'sawtooth',0.14,{cut:300,cut2:120});
      if(s===2||s===9)[0,3,7,10].forEach(function(n){tone(t,r+12+n,0.35,'sawtooth',0.025,{cut:1400,cut2:400,send:0.5});});}},
    keys:{bpm:66,step:function(i,t){var b=i>>4,s=i%16,ch=[CH.em,CH.c,CH.g,CH.d][b];
      if(s%2===0){var a=[0,1,2,3,2,1,3,2][s>>1];tone(t,ch[a]+12,1.5,'triangle',0.07,{cut:2200,cut2:600,a:0.004,send:0.45});}
      if(s===0)tone(t,ch[0]-12,2.4,'sine',0.16,{a:0.02});if(s===8)tone(t,ch[0]-5,1.4,'sine',0.08,{a:0.02});}}
  };

  function boot(){
    if(ctx)return true; if(!AC)return false;
    try{ctx=new AC();}catch(e){ctx=null;return false;}
    master=ctx.createGain();master.gain.value=0.32;comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    dly=ctx.createDelay(1.5);dly.delayTime.value=0.42;var fb=ctx.createGain(),lp=ctx.createBiquadFilter();fb.gain.value=0.38;
    lp.type='lowpass';lp.frequency.value=2400;dlyIn=ctx.createGain();dlyIn.connect(dly);dly.connect(lp);lp.connect(fb);fb.connect(dly);
    var wet=ctx.createGain();wet.gain.value=0.55;lp.connect(wet);wet.connect(master);
    return true;}
  function stopLoop(){clearInterval(timer);timer=0;if(bus){var b=bus;try{b.gain.cancelScheduledValues(ctx.currentTime);b.gain.setTargetAtTime(0,ctx.currentTime,0.12);}catch(e){}
      setTimeout(function(){try{b.disconnect();}catch(e){}},1200);bus=null;}}
  function startLoop(id){
    stopLoop();var L=LP[id];bus=ctx.createGain();bus.gain.value=0;bus.connect(master);bus.gain.setTargetAtTime(1,ctx.currentTime,0.25);
    stepN=0;nextT=ctx.currentTime+0.08;var sd=60/L.bpm/4;
    timer=setInterval(function(){if(!ctx||ctx.state!=='running')return;while(nextT<ctx.currentTime+0.2){L.step(stepN%64,nextT);nextT+=sd;stepN++;}},40);}
  function choose(id){
    window.crClosePops&&window.crClosePops();
    if(!id){cur=null;stopLoop();try{localStorage.setItem('cr-music','off');}catch(e){}paint();return;}
    if(!boot()){return;}
    cur=id;last=id;try{localStorage.setItem('cr-music',id);}catch(e){}
    var go=function(){if(cur===id)startLoop(id);};
    if(ctx.state==='suspended')ctx.resume().then(go,go);else go();
    paint();}
  document.addEventListener('visibilitychange',function(){if(!ctx)return;
    if(document.hidden){clearInterval(timer);timer=0;ctx.suspend&&ctx.suspend();}
    else if(cur){ctx.resume().then(function(){if(cur&&!timer){nextT=ctx.currentTime+0.08;var L=LP[cur],sd=60/L.bpm/4;
      timer=setInterval(function(){if(ctx.state!=='running')return;while(nextT<ctx.currentTime+0.2){L.step(stepN%64,nextT);nextT+=sd;stepN++;}},40);}});}});
  paint();
})();
</script>
