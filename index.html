<style>
@font-face{font-family:'Inter Variable';font-style:normal;font-display:swap;font-weight:100 900;src:url(/inter.woff2) format('woff2-variations');}
/* Layout: one still, dark stage. The spinning symbol and the official wordmark sit dead centre; everything else whispers at the edges. */
:root{
  --bg:#000; --fg:#f4f4f2; --muted:#8a8c8c; --line:#2a2c2d; --panel:#0d0e0f;
  --mark-filter:invert(0); --blend:screen;
  --face:'Inter Variable',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#fff; --fg:#0a0a0a; --muted:#6b6d6e; --line:#dcdddc; --panel:#f6f6f5;
  --mark-filter:invert(1); --blend:multiply;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--face);font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .6s ease,color .6s ease;overflow:hidden}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.stage{position:relative}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 45%,var(--bg) 100%)}
.stage{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-block:18px 20px;box-sizing:border-box}
.top{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.bgname{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s ease;pointer-events:none}
.bgname.show{opacity:1}
#bgCycle svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.5;transition:transform .6s ease}
.theme{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.theme span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.theme:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.centre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.5vh,14px);min-height:0;padding-bottom:7vh}
.centre{--w:min(62vw,40vh,380px)}  /* wordmark width; the symbol is sized from it, as in the official stacked logo */
.symbol{width:calc(var(--w) * 1.008);aspect-ratio:1;max-width:100%;filter:contrast(1.15) var(--mark-filter);
  margin:calc(var(--w) * -0.09) 0 calc(var(--w) * -0.177);  /* frames carry empty space; this leaves the official symbol-to-wordmark gap */
  opacity:0;animation:rise 1.6s .1s ease forwards}
#symbol{cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#symbol.drag{cursor:grabbing}
.word{width:var(--w);position:relative;height:auto;filter:var(--mark-filter);opacity:0;animation:rise 1.4s .9s ease forwards}
.soon{font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;padding-left:.32em;opacity:0;animation:rise 1.4s 1.6s ease forwards}
.tag{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.03em;color:var(--fg);margin:22px 0 0;text-align:center;opacity:0;animation:rise 1.4s 1.2s ease forwards}
.line{text-wrap:balance;max-width:92vw;font-size:clamp(14px,2vw,16px);font-weight:400;color:var(--muted);margin:6px 0 0;text-align:center;letter-spacing:-.01em;opacity:0;animation:rise 1.4s 1.4s ease forwards}
.mail{font-weight:600;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
.symwrap{position:relative;display:flex;justify-content:center}
.spinhint{margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none;opacity:0;animation:hint 1.2s 3s ease forwards;transition:opacity .6s ease}
.spinhint.used{opacity:0!important;animation:none}
@keyframes hint{to{opacity:.8}}
.mail:hover{border-color:var(--fg)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

footer{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
footer a,footer button{color:var(--muted);text-decoration:none;background:none;border:0;padding:4px 0;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
footer a:hover,footer button:hover{color:var(--fg)}
.contact{display:inline-flex;align-items:center;gap:8px}
.contact svg{transition:transform .3s ease}
.contact:hover svg{transform:translateY(-1px)}

.chat{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));height:min(520px,calc(100dvh - 32px));display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden;
  transform-origin:100% 100%;animation:pop .45s cubic-bezier(.2,.9,.25,1.15)}
.chat[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line)}
.chat-av{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--bg)}
.chat-av img{width:18px;height:auto;filter:var(--mark-filter)}
.chat-who{flex:1;min-width:0}
.chat-who b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.chat-who span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chat-who span i{width:7px;height:7px;border-radius:50%;background:#3ccf7a;box-shadow:0 0 0 3px rgba(60,207,122,.18)}
.close{background:none;border:0;color:var(--muted);font:inherit;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.close:hover{color:var(--fg)}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.b{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;animation:rise .3s ease;overflow-wrap:anywhere}
.b.us{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:6px}
.b.them{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:6px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;background:var(--bg)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chat-in{display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;font:inherit;font-size:16px;color:var(--fg);background:transparent;border:0;outline:0;resize:none;max-height:120px;min-height:24px;padding:8px 0;line-height:1.4}
.chat-in textarea::placeholder{color:var(--muted)}
.chat-send{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .2s ease,opacity .2s}
.chat-send:disabled{opacity:.3;cursor:default}
.chat-send:not(:disabled):hover{transform:scale(1.06)}
.chat-foot{font-size:11px;color:var(--muted);text-align:center;padding:0 12px 10px}
.chat-foot a{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-end;justify-content:flex-end;max-width:92%;animation:rise .3s ease}
.chip{font:inherit;font-size:13.5px;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover,.chip:focus-visible{background:var(--fg);color:var(--bg);border-color:var(--fg);outline:0}
.chat-count{font-size:11px;color:var(--muted);text-align:right;padding:0 16px 4px}
.chat-count.over{color:#e5484d}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media (max-width:520px){.chat{right:0;left:0;bottom:0;width:100%;height:min(78dvh,560px);border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}}
@media (max-width:520px){.preview{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));top:calc(26px + env(safe-area-inset-top,0px));font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:5px 10px}
@media (prefers-reduced-motion:reduce){.symbol,.word,.tag,.soon,.line,.chat,.b{animation:none;opacity:1}}
</style>
</head>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeToggle');
  function apply(t){
    if(t==='light'){root.setAttribute('data-theme','light');btn.setAttribute('aria-label','Switch to dark');}
    else{root.setAttribute('data-theme','dark');btn.setAttribute('aria-label','Switch to light');}
  }
  var saved=null; try{saved=localStorage.getItem('cr-theme');}catch(e){}
  apply(saved==='light'?'light':'dark');
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='light'?'dark':'light'; apply(next);
    try{localStorage.setItem('cr-theme',next);}catch(e){}
  });


  /* Chat: a short, polite conversation. No AI and no cost: the message goes to hello@ and a person replies by email.
     Guard rails run in the browser: topic first, a length limit, a polite word check, no card numbers or passwords,
     a hidden bot trap, one message per visit and three per day. */
  var SEND_URL='', SEND_KEY='';  /* set at go-live (form delivery service); empty = preview, nothing is sent */
  var MAXLEN=1000, PER_DAY=3;
  var chat=document.getElementById('chat'), log=document.getElementById('chatLog'), cf=document.getElementById('chatForm'),
      inp=document.getElementById('chatInput'), sendBtn=document.getElementById('chatSend'), count=document.getElementById('chatCount'),
      step=-1, started=false, sent=false, openedAt=0, data={};
  function bubble(t,who){var d=document.createElement('div');d.className='b '+who;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
  function say(t,cb){var ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';log.appendChild(ty);log.scrollTop=log.scrollHeight;
    setTimeout(function(){ty.remove();bubble(t,'us');if(cb)cb();},650+Math.min(900,t.length*12));}
  function ask(ph,type){inp.placeholder=ph;inp.setAttribute('inputmode',type==='email'?'email':'text');inp.disabled=false;inp.focus();}
  function lock(ph){inp.disabled=true;sendBtn.disabled=true;inp.placeholder=ph;}
  function today(){return new Date().toISOString().slice(0,10);}

    var u=Math.min(W,H), a=PH*0.035, ca=Math.cos(a), sa=Math.sin(a), ph=PH*0.16, cx=AX-mx*30*D, cy=AY-my*24*D;
    for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){var X=(i*s-cx)/u,Y=(j*s-cy)/u,xr=X*ca-Y*sa,yr=X*sa+Y*ca;
      CF[j*cols+i]=1.15*Math.exp(-(X*X+Y*Y)*5)+0.34*Math.sin(xr*4.6+ph)+0.28*Math.sin(yr*3.9-ph*0.8+1.3)
        +0.2*Math.sin((xr+yr)*7.3+ph*1.3+0.5)+0.12*Math.sin((xr-yr)*10.5+2.1-ph);}
    var thin=new Path2D(), bold=new Path2D(), STEP=0.15;
    for(var L=-1.05,li=0;L<1.9;L+=STEP,li++){var P=(li%5===0)?bold:thin;
      for(var j2=0;j2<rows-1;j2++)for(var i2=0;i2<cols-1;i2++){var o=j2*cols+i2,v0=CF[o],v1=CF[o+1],v2=CF[o+cols+1],v3=CF[o+cols];
        var id=(v0>L?1:0)|(v1>L?2:0)|(v2>L?4:0)|(v3>L?8:0);if(!id||id===15)continue;
        var sg=SEG[id],x0=i2*s,y0=j2*s;
        for(var e=0;e<sg.length;e+=2){var A=ept(sg[e]),B=ept(sg[e+1]);P.moveTo(A[0],A[1]);P.lineTo(B[0],B[1]);}
      }}
    function ept(k){var t;if(k===0){t=(L-v0)/(v1-v0);return [x0+t*s,y0];}if(k===1){t=(L-v1)/(v2-v1);return [x0+s,y0+t*s];}
      if(k===2){t=(L-v3)/(v2-v3);return [x0+t*s,y0+s];}t=(L-v0)/(v3-v0);return [x0,y0+t*s];}
    x.lineWidth=Math.max(1,D*0.75);x.strokeStyle=col(0.14);x.stroke(thin);
    x.lineWidth=Math.max(1,D*1.1);x.strokeStyle=col(0.24);x.stroke(bold);
  }

  /* ---------- ripples: rings sent out from the symbol, faster as it spins and drawn back in when it reverses ---------- */
  function drawRipples(){
    var u=Math.min(W,H), S=Math.max(34*D,Math.min(72*D,u/13)), cx=AX-mx*20*D, cy=AY-my*16*D,
      R=Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy)), off=((PH*14*D)%S+S)%S;
    x.lineWidth=Math.max(1,D*0.8);
    for(var r=off;r<R;r+=S){var f=r/R, a=0.26*Math.pow(1-f,1.2)*Math.min(1,r/(S*1.6)); if(a<0.004)continue;
      var N=Math.max(48,Math.min(220,Math.round(r/(5*D)))), w=S*0.1*f;
      x.beginPath();
      for(var k=0;k<=N;k++){var th=k*TAU/N, rr=r+w*(0.6*Math.sin(th*3+PH*0.25+r*0.004)+0.4*Math.sin(th*5-PH*0.18+1.7));
        var X=cx+rr*Math.cos(th),Y=cy+rr*Math.sin(th);k?x.lineTo(X,Y):x.moveTo(X,Y);}
      x.strokeStyle=col(a);x.stroke();
      // a fine dotted echo between rings
      var r2=r+S*0.5; if(r2<R){x.setLineDash([1.2*D,6*D]);x.beginPath();x.arc(cx,cy,r2,PH*0.05,PH*0.05+TAU);x.strokeStyle=col(a*0.55);x.stroke();x.setLineDash([]);}
    }
  }

  /* ---------- lattice: a tessellation of tumbling blocks; each cell flips a sixth of a turn as a wave from the symbol reaches it ---------- */
  function drawLattice(){
    var h=Math.max(18,Math.min(34,Math.min(W,H)/D/22))*D, dx=Math.sqrt(3)*h, dy=1.5*h, ox=AX-mx*18*D, oy=AY-my*14*D,
      i0=Math.floor(-ox/dx)-1, i1=Math.ceil((W-ox)/dx)+1, j0=Math.floor(-oy/dy)-1, j1=Math.ceil((H-oy)/dy)+1,
      hex=new Path2D(), arms=new Path2D(), face=new Path2D(), V=[], k;
    for(k=0;k<6;k++)V.push([Math.cos(Math.PI/6+k*Math.PI/3)*h,Math.sin(Math.PI/6+k*Math.PI/3)*h]);  // pointy-top hexagon
    for(var j=j0;j<=j1;j++)for(var i=i0;i<=i1;i++){
      var X=ox+i*dx+((j&1)?dx/2:0), Y=oy+j*dy;
      hex.moveTo(X+V[0][0],Y+V[0][1]);for(k=1;k<6;k++)hex.lineTo(X+V[k][0],Y+V[k][1]);hex.closePath();
      var d=Math.hypot(X-AX,Y-AY)/D, u=PH*0.32-d/240, st=Math.floor(u), f=u-st, e=f<0.6?0:(f-0.6)/0.4; e=e*e*(3-2*e);
      var rot=(st+e)*Math.PI/3;
      for(k=0;k<3;k++){var aa=rot+Math.PI/2+k*TAU/3;arms.moveTo(X,Y);arms.lineTo(X+Math.cos(aa)*h,Y+Math.sin(aa)*h);}
      var b=rot+Math.PI*7/6;face.moveTo(X,Y);
      for(k=0;k<3;k++){var ab=b+k*Math.PI/3;face.lineTo(X+Math.cos(ab)*h,Y+Math.sin(ab)*h);}face.closePath();
    }
    x.lineWidth=Math.max(1,D*0.7);x.fillStyle=col(0.035);x.fill(face);x.strokeStyle=col(0.07);x.stroke(hex);
    x.lineWidth=Math.max(1,D*0.9);x.strokeStyle=col(0.15);x.stroke(arms);
  }

  function build(){if(MODE==='gears')buildGears();else if(MODE==='network')buildNet();else if(MODE==='orbits')buildOrbits();
    var ps=document.querySelectorAll('[data-bg]');for(var i=0;i<ps.length;i++)ps[i].setAttribute('aria-pressed',ps[i].getAttribute('data-bg')===MODE);}
  function render(dt,spin){
    anchor();
    x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,W,H);
    x.globalAlpha=FADE[MODE]*(root.getAttribute('data-theme')==='light'?LIGHT:1);
    if(MODE==='gears')drawGears();
    else if(MODE==='network')drawNet(dt,spin);
    else if(MODE==='orbits')drawOrbits(OT);
    else if(MODE==='contours')drawContours();
    else if(MODE==='ripples')drawRipples();
    else drawLattice();
    x.setTransform(1,0,0,1,0,0); x.globalAlpha=1; quiet();
  }
  function size(){D=Math.min(window.devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);build();if(still)render(0,1);}
  size(); addEventListener('resize',size); addEventListener('orientationchange',function(){setTimeout(size,250);});
  if(still){addEventListener('load',function(){render(0,1);});setTimeout(function(){render(0,1);},1800);return;}  // reduced motion: one still picture, redrawn only when something changes
  addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);},{passive:true});
  addEventListener('deviceorientation',function(e){if(e.gamma!=null){tx=Math.max(-.5,Math.min(.5,e.gamma/60));ty=Math.max(-.5,Math.min(.5,(e.beta-45)/60));}},{passive:true});
  document.addEventListener('visibilitychange',function(){run=!document.hidden;prev=performance.now();if(run)requestAnimationFrame(frame);});
  function frame(now){
    if(!run)return;
    var dt=Math.min(0.05,(now-prev)/1000)*(window.crWake==null?1:window.crWake);prev=now; mx+=(tx-mx)*0.04; my+=(ty-my)*0.04;
    var spin=window.crSpin||1;              // 1 = normal pace; bigger when the symbol is flicked; negative = reversed
    T+=dt; PH+=dt*spin; OT+=dt*Math.max(0.3,Math.abs(spin));
    if(MODE==='contours'&&(skip++&1)){requestAnimationFrame(frame);return;}  // the field drifts slowly, so half the frames are plenty
    render(dt,spin);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* Spinnable symbol: 120 evenly spaced turns of the official rotation, drawn from four sprite sheets.
   It turns at its normal pace; a swipe flings it faster either way, then it eases back to the normal pace in that direction. */
(function(){
  var c=document.getElementById('symbol'), x=c.getContext('2d'); if(!x) return;
  var hintEl=document.getElementById('spinHint'); if(hintEl&&window.matchMedia&&matchMedia('(pointer: coarse)').matches)hintEl.textContent='‹ swipe to spin ›';
  var N=120, PER=30, COLS=6, CELL=400, BASE=24, sheets=[], ready=[];
  // The frames are a white symbol on black. Turn the black into true transparency so the symbol is solid
  // and the background sits behind it, instead of showing through it.
  function solid(im){try{var o=document.createElement('canvas');o.width=im.naturalWidth;o.height=im.naturalHeight;
    var ox=o.getContext('2d');ox.drawImage(im,0,0);var d=ox.getImageData(0,0,o.width,o.height),p=d.data;
    for(var i=0;i<p.length;i+=4){var L=Math.max(p[i],p[i+1],p[i+2]);p[i+3]=L<14?0:Math.min(255,(L-14)*255/56);}
    ox.putImageData(d,0,0);return o;}catch(e){return im;}}
  for(var s=0;s<4;s++){(function(s){var im=new Image();im.onload=function(){sheets[s]=solid(im);ready[s]=true;};im.src='spin'+s+'.jpg';sheets[s]=im;})(s);}
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOLD=2000, hold=performance.now()+HOLD, wake=still?1:0;  // a fresh visit starts still, then eases up to the normal pace
  var pos=0, vel=0, dir=1, drag=false, lastX=0, lastT=0, dragV=0, prev=performance.now(), run=true, drawn=-1;
  function fit(){var d=Math.min(window.devicePixelRatio||1,2), w=Math.round(c.clientWidth*d)||CELL; if(c.width!==w){c.width=c.height=w;drawn=-1;}}
  addEventListener('resize',fit);
  function pxToFrames(){return N/((c.clientWidth||300)*1.4);}
  c.addEventListener('pointerdown',function(e){var hn=document.getElementById('spinHint');if(hn)hn.classList.add('used');drag=true;hold=0;wake=1;c.classList.add('drag');lastX=e.clientX;lastT=e.timeStamp;dragV=0;try{c.setPointerCapture(e.pointerId);}catch(_){}});
  c.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lastX, dt=Math.max(1,e.timeStamp-lastT)/1000;
    var df=dx*pxToFrames(); pos+=df; dragV=dragV*0.6+(df/dt)*0.4; lastX=e.clientX;lastT=e.timeStamp;});
  function end(){if(!drag)return;drag=false;c.classList.remove('drag');
    vel=Math.max(-720,Math.min(720,dragV)); if(Math.abs(vel)>BASE*0.25)dir=vel>0?1:-1;}
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('lostpointercapture',end);
  document.addEventListener('visibilitychange',function(){run=!document.hidden;prev=performance.now();if(run)requestAnimationFrame(tick);});
  // Every fresh visit (including coming back with the browser's Back button) starts still for 2 seconds, then eases up to the normal pace, in the normal direction.
  addEventListener('pageshow',function(e){if(e.persisted){dir=1;vel=0;hold=performance.now()+HOLD;wake=still?1:0;drag=false;dragV=0;window.crSpin=0;window.crWake=wake;}});
  function tick(now){
    if(!run)return;
    var dt=Math.min(0.05,(now-prev)/1000); prev=now;
    if(!drag){var target=(still||now<hold)?0:dir*BASE; vel+=(target-vel)*(1-Math.exp(-dt/0.8)); pos+=vel*dt;}
    else if(now-lastT>80){dragV*=0.8;}
    if(!drag&&now>=hold)wake=Math.max(wake,Math.min(1,Math.abs(vel)/BASE*1.05));
    window.crSpin=(drag?dragV:vel)/BASE; window.crWake=wake;
    var f=((Math.round(pos)%N)+N)%N, s=Math.floor(f/PER);
    if(!ready[s]){for(var k=0;k<4;k++)if(ready[k]){s=k;f=k*PER;break;}}
    if(ready[s]&&f!==drawn){fit();var i=f-s*PER;x.clearRect(0,0,c.width,c.height);
      x.drawImage(sheets[s],(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL,0,0,c.width,c.height);drawn=f;}
    requestAnimationFrame(tick);
  }
  fit(); requestAnimationFrame(tick);
})();
(function(){var b=document.getElementById('bgCycle'),n=document.getElementById('bgName'),L=['gears','network','orbits','contours','ripples','lattice'],N={gears:'Gears',network:'Network',orbits:'Orbits',contours:'Contours',ripples:'Ripples',lattice:'Lattice'},t,turn=0;if(!b)return;
  b.addEventListener('click',function(){var cur='gears';try{cur=localStorage.getItem('cr-bg')||'gears'}catch(e){}
    var next=L[(L.indexOf(cur)+1)%L.length];window.crSetBackground&&window.crSetBackground(next);
    turn+=60;b.querySelector('svg').style.transform='rotate('+turn+'deg)';n.textContent=N[next];n.classList.add('show');clearTimeout(t);t=setTimeout(function(){n.classList.remove('show');},1600);});})();
</script>
